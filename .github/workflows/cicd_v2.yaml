name: CI-CD Docker Web

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      # ---- Build ----
      - name: Construir imagen Docker
        run: |
          docker build -t miweb:latest .

      # ---- Test ----
      - name: Ejecutar tests
        run: |
          chmod +x tests/test_dummy.sh
          # ./tests/test_dummy.sh
          ./tests/01_test.sh

      # ---- Login Docker Hub ----
      - name: Login a DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Tag + Push ----
      - name: Subir imagen a Docker Hub
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/miweb:latest"
          docker tag miweb:latest $IMAGE_NAME
          docker push $IMAGE_NAME