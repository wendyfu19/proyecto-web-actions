name: CI/CD Docker Web

on:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build Pipeline
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: |
          # Usar la versión del archivo o generar una
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
          else
            VERSION="v0.0.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"
      
      - name: Build Docker image
        run: |
          docker build -t miweb:${{ steps.get_version.outputs.version }} .
          echo "✅ Image built: miweb:${{ steps.get_version.outputs.version }}"

  test:
    name: Test Pipeline
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build image for testing
        run: |
          echo "Testing version: ${{ needs.build.outputs.version }}"
          docker build -t miweb:${{ needs.build.outputs.version }} .
      
      - name: Run tests
        run: |
          chmod +x tests/01_test.sh
          ./tests/01_test.sh
      
      - name: Log test results
        run: |
          echo "✅ Tests passed for version: ${{ needs.build.outputs.version }}"

  publish:
    name: Publish Pipeline
    runs-on: ubuntu-latest
    needs: [build, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build final image
        run: |
          echo "Publishing version: ${{ needs.build.outputs.version }}"
          docker build -t miweb:${{ needs.build.outputs.version }} .
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push to DockerHub
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/miweb:${{ needs.build.outputs.version }}"
          docker tag miweb:${{ needs.build.outputs.version }} $IMAGE_TAG
          docker push $IMAGE_TAG
          echo "✅ Image published: $IMAGE_TAG"