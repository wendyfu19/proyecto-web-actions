name: CI-CD Docker Web

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtener versión desde release-please
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo "latest")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build imagen
        run: |
          docker build -t miweb:${{ steps.get_version.outputs.version }} .

      - name: Test
        run: |
          chmod +x tests/test_dummy.sh
          ./tests/test_dummy.sh

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push imagen
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/miweb:${{ steps.get_version.outputs.version }}"
          docker tag miweb:${{ steps.get_version.outputs.version }} $IMAGE
          docker push $IMAGE